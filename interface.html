<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- La chat di VS Code mostra LA STESSA pagina del telefono, servita dal server
     locale: stessa grafica, stesse funzioni, stessa conversazione condivisa. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; frame-src http://127.0.0.1:* http://localhost:*; style-src 'unsafe-inline';">
<style>
  html,body{margin:0;padding:0;height:100%;background:#262624}
  iframe{border:0;width:100%;height:100vh;display:block}
  .fallback{color:#a8a49c;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;line-height:1.6}
</style>
</head>
<body>
  <iframe src="${serverUrl}" allow="clipboard-read; clipboard-write"></iframe>
  <noscript><div class="fallback">Abilita gli script per usare Antigravity.</div></noscript>
</body>
</html>
